<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
  body{margin:0;background:#FFFEF5;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#16182B}
  h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
  a{color:#3347CA}a:hover{color:#25349B}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column">

<div style="display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1.5px solid #ECEAE0;background:#FFFEF5">
  <a href="accueil.html" style="display:flex;align-items:center;height:34px;width:145px;overflow:hidden"><img src="assets/logo-mot.png" alt="Silvousplait" style="width:145px;flex:none;margin-top:-7px"></a>
  <a href="accueil.html" style="font:600 13.5px 'Instrument Sans',sans-serif;color:#3347CA;text-decoration:none" style-hover="color:#25349B">← Retour au site</a>
</div>

<div style="flex:1;max-width:720px;width:100%;margin:0 auto;padding:52px 24px 80px;box-sizing:border-box">
  <h1 style="font-size:34px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px">Politique de confidentialité</h1>
  <p style="font:400 13.5px 'Instrument Sans',sans-serif;color:#8B8DA0;margin:0 0 36px">Dernière mise à jour&nbsp;: juillet 2026</p>

  <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="9">
    <div style="margin-bottom:26px">
      <h2 style="font-size:17px;font-weight:700;letter-spacing:-.005em;margin-bottom:7px">{{ sec.title }}</h2>
      <sc-for list="{{ sec.paras }}" as="p">
        <p style="font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#4A4D66;margin:0 0 10px">{{ p.text }}</p>
      </sc-for>
    </div>
  </sc-for>
</div>

<div style="background:#16182B;padding:28px 32px;display:flex;align-items:center;justify-content:center;gap:28px;font:500 13px 'Instrument Sans',sans-serif">
  <a href="faq.html" style="color:#A7A9BC;text-decoration:none">Questions et aide</a>
  <a href="contact.html" style="color:#A7A9BC;text-decoration:none">Contact</a>
  <a href="partenariat.html" style="color:#A7A9BC;text-decoration:none">Partenariat</a>
  <a href="termes.html" style="color:#A7A9BC;text-decoration:none">Termes</a>
  <a href="politique.html" style="color:#A7A9BC;text-decoration:none">Politique</a>
  <span style="color:#4A4D66">© 2026 Silvousplait</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Collecte des renseignements personnels', ["La présente politique de confidentialité s'applique aux services offerts par Silvousplait inc., société légalement constituée au Québec. Silvousplait collecte uniquement les renseignements personnels nécessaires au fonctionnement de ses services, notamment lors de l'inscription à l'infolettre gratuite ou au Forfait Premium. Les informations recueillies se limitent principalement au nom, à l'adresse courriel, à la ville de préférence et, le cas échéant, à certaines données de facturation liées au Forfait Premium."]],
      ['Utilisation des renseignements', ["Les renseignements personnels collectés sont utilisés exclusivement pour l'envoi de l'infolettre hebdomadaire et des communications ponctuelles, la gestion des abonnements, incluant l'accès au Forfait Premium, des fins de service à la clientèle, la gestion de concours et tirages, ainsi que pour répondre aux demandes ou aux questions transmises par les utilisateurs."]],
      ['Communication à des tiers', ["Silvousplait ne partage vos renseignements personnels avec des tiers que dans la mesure nécessaire à la prestation de ses services, ou avec votre consentement. Cela peut inclure notre plateforme d'infolettre, notre processeur de paiement pour la gestion du Forfait Premium, ou un partenaire culturel dans le cadre d'un concours ou d'une remise de prix. Ces fournisseurs et partenaires sont tenus de protéger vos renseignements avec un niveau de sécurité adéquat et ne peuvent les utiliser qu'aux fins pour lesquelles ils nous sont fournis. Lorsque vous effectuez un paiement, vos informations de carte de crédit sont collectées directement par notre processeur de paiement et non par Silvousplait, et sont soumises à la politique de confidentialité de ce dernier.", "Silvousplait ne vend pas vos renseignements personnels à des tiers à des fins commerciales. Dans l'éventualité d'une transaction importante impliquant l'entreprise, telle qu'une fusion, une acquisition ou une vente d'actifs, vos renseignements personnels pourraient être transférés dans le cadre de cette transaction, sous réserve des mêmes protections que celles prévues à la présente politique."]],
      ['Témoins, pixels et outils de mesure', ["Silvousplait peut utiliser des témoins, pixels de suivi, balises, scripts d'analyse ou technologies similaires, notamment Meta Pixel, Google Tag Manager et Microsoft Clarity, afin de mesurer la performance du site, comprendre l'utilisation des pages, améliorer les services, détecter certains problèmes techniques et évaluer l'efficacité de ses communications ou campagnes publicitaires. Ces outils peuvent recueillir certaines informations techniques ou de navigation, comme l'adresse IP, le type d'appareil, le navigateur, les pages consultées, les interactions effectuées sur le site et l'origine de la visite.", "Ces technologies peuvent être fournies par des tiers qui traitent les informations selon leurs propres politiques de confidentialité. Silvousplait ne contrôle pas entièrement les pratiques de ces plateformes externes, mais limite leur utilisation aux fins raisonnables d'analyse, de mesure, de sécurité, d'amélioration du site et de promotion de ses services. Silvousplait ne cherche pas à recueillir volontairement des renseignements sensibles au moyen de ces pixels.", "Lorsque requis par la loi applicable, l'utilisation de certaines technologies non essentielles peut dépendre du consentement de l'utilisateur. Les utilisateurs peuvent aussi limiter ou bloquer les témoins et pixels au moyen des paramètres de leur navigateur, de leurs outils de confidentialité, des préférences offertes par les plateformes concernées ou en communiquant avec Silvousplait. La désactivation de certaines technologies peut toutefois limiter la précision des statistiques, de la personnalisation ou de certaines fonctionnalités non essentielles du site."]],
      ['Mesures de sécurité', ["Silvousplait inc. prend des mesures raisonnables, conformes aux meilleures pratiques de l'industrie, afin d'assurer la protection, la confidentialité et la sécurité des renseignements personnels qu'elle détient. Les données sont conservées uniquement pour la durée nécessaire à la réalisation des finalités pour lesquelles elles ont été collectées."]],
      ['Vos droits', ["Vous pouvez en tout temps refuser de fournir certains renseignements personnels, retirer votre consentement à leur utilisation, ou vous désabonner de l'infolettre en envoyant un courriel à spectacles@silvousplaitsvp.com. Notez que le retrait de certains renseignements peut limiter notre capacité à vous offrir nos services. Les demandes sont traitées dans des délais raisonnables, sans justification requise."]],
      ['Accès et rectification', ["Toute personne peut demander l'accès aux renseignements personnels que nous détenons à son sujet, en obtenir une copie, ou demander la correction de renseignements inexacts ou incomplets, en communiquant avec Silvousplait à l'adresse spectacles@silvousplaitsvp.com. Une preuve d'identité peut être demandée afin de traiter la demande."]],
      ['Modifications de la politique', ["Silvousplait se réserve le droit de modifier la présente politique de confidentialité afin de refléter l'évolution de ses pratiques ou des exigences légales. Toute modification sera publiée sur le site web."]],
      ['Responsable du traitement des renseignements personnels', ["Contact: spectacles@silvousplaitsvp.com"]]
    ];
    return { sections: data.map(([title, paras]) => ({ title, paras: paras.map(text => ({ text })) })) };
  }
}
</script>
</body>
</html>
