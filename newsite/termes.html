<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
  body{margin:0;background:#FFFEF5;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#16182B}
  h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
  a{color:#3347CA}a:hover{color:#25349B}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column">

<div style="display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1.5px solid #ECEAE0;background:#FFFEF5">
  <a href="accueil.html" style="display:flex;align-items:center;height:34px;width:145px;overflow:hidden"><img src="assets/logo-mot.png" alt="Silvousplait" style="width:145px;flex:none;margin-top:-7px"></a>
  <a href="accueil.html" style="font:600 13.5px 'Instrument Sans',sans-serif;color:#3347CA;text-decoration:none" style-hover="color:#25349B">← Retour au site</a>
</div>

<div style="flex:1;max-width:720px;width:100%;margin:0 auto;padding:52px 24px 80px;box-sizing:border-box">
  <h1 style="font-size:34px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px">Conditions d'utilisation</h1>
  <p style="font:400 13.5px 'Instrument Sans',sans-serif;color:#8B8DA0;margin:0 0 36px">Dernière mise à jour&nbsp;: juillet 2026</p>

  <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="14">
    <div style="margin-bottom:26px">
      <h2 style="font-size:17px;font-weight:700;letter-spacing:-.005em;margin-bottom:7px"><span style="color:#3347CA">{{ sec.num }}.</span> {{ sec.title }}</h2>
      <p style="font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#4A4D66;margin:0">{{ sec.body }}</p>
    </div>
  </sc-for>
</div>

<div style="background:#16182B;padding:28px 32px;display:flex;align-items:center;justify-content:center;gap:28px;font:500 13px 'Instrument Sans',sans-serif">
  <a href="faq.html" style="color:#A7A9BC;text-decoration:none">Questions et aide</a>
  <a href="contact.html" style="color:#A7A9BC;text-decoration:none">Contact</a>
  <a href="partenariat.html" style="color:#A7A9BC;text-decoration:none">Partenariat</a>
  <a href="termes.html" style="color:#A7A9BC;text-decoration:none">Termes</a>
  <a href="politique.html" style="color:#A7A9BC;text-decoration:none">Politique</a>
  <span style="color:#4A4D66">© 2026 Silvousplait</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Acceptation des conditions', "Les présentes conditions d'utilisation régissent l'accès et l'utilisation du site web et des services offerts par Silvousplait. En utilisant les services, incluant l'inscription à l'infolettre gratuite ou au Forfait Premium, vous acceptez les présentes conditions."],
      ['Description du service', "Silvousplait offre un service de recommandation culturelle diffusé principalement sous la forme d'une infolettre hebdomadaire. Le service vise à faciliter la découvrabilité de spectacles à prix abordable. Silvousplait inc. n'est pas une plateforme de vente de billets et n'intervient pas dans les transactions effectuées sur des plateformes tierces ou auprès de nos partenaires culturels."],
      ['Code de conduite', "En utilisant le site web, vous vous engagez à ne pas l'utiliser d'une manière qui viole les présentes conditions ou les droits de propriété intellectuelle de Silvousplait ou d'un tiers, à ne pas propager de pourriel ou de contenu malveillant, à ne pas tenter de perturber le bon fonctionnement du site, et à ne pas harceler ou utiliser un langage abusif envers Silvousplait ou ses représentants."],
      ["Exactitude de l'information", "Silvousplait s'efforce de fournir des informations exactes et à jour. Toutefois, les informations relatives aux spectacles (dates, prix, disponibilité) peuvent être modifiées sans préavis par les producteurs, diffuseurs ou plateformes de billetterie. Silvousplait ne peut être tenue responsable de ces changements."],
      ['Utilisation du contenu', "L'ensemble du contenu diffusé par Silvousplait, incluant les textes, visuels et sélections éditoriales, est protégé par les lois applicables en matière de propriété intellectuelle. Toute reproduction ou utilisation non autorisée est interdite sans autorisation écrite préalable."],
      ['Abonnement, frais et renouvellement', "L'inscription à l'infolettre gratuite est offerte sans frais. Le Forfait Premium est offert au prix de 60$ par année, plus taxes applicables, payable par carte de crédit via Stripe. L'abonnement se renouvelle automatiquement à la fin de chaque période, sauf annulation. Vous pouvez annuler votre abonnement en tout temps en vous connectant à votre compte ou en communiquant avec spectacles@silvousplaitsvp.com; l'annulation prend effet à la fin de la période payée en cours."],
      ['Politique de remboursement', "Silvousplait offre une politique de remboursement de 30 jours. Si le Forfait Premium ne répond pas à vos attentes, vous pouvez demander un remboursement en écrivant à spectacles@silvousplaitsvp.com dans les 30 jours suivant le début ou le renouvellement de votre abonnement. Aucun remboursement partiel n'est offert après cette période."],
      ['Limitation de responsabilité', "Silvousplait ne peut être tenue responsable des décisions prises par les utilisateurs à la suite des recommandations proposées, ni de l'expérience vécue lors des spectacles recommandés. Le service est offert à titre informatif et éditorial, « tel quel », sans garantie d'aucune sorte. Dans la mesure permise par la loi, la responsabilité totale de Silvousplait envers un utilisateur ne peut excéder le montant payé par celui-ci au cours des 12 derniers mois."],
      ['Indemnisation', "Vous acceptez d'indemniser et de tenir Silvousplait inc. indemne de toute réclamation découlant de votre utilisation du site web ou de votre violation des présentes conditions."],
      ['Liens externes', "Le site web et les communications de Silvousplait peuvent contenir des liens vers des sites tiers, incluant ceux de nos partenaires culturels et plateformes de billetterie. Silvousplait n'exerce aucun contrôle sur ces sites et décline toute responsabilité quant à leur contenu."],
      ['Interruption des services', "Le site web peut être temporairement indisponible en raison de maintenance ou d'un cas de force majeure. Silvousplait ne peut être tenue responsable des pertes découlant d'une telle interruption."],
      ['Modification des conditions', "Silvousplait se réserve le droit de modifier les présentes conditions d'utilisation à tout moment. Les modifications entrent en vigueur dès leur publication sur le site web."],
      ['Droit applicable', "Les présentes conditions sont régies par les lois applicables dans la province de Québec et au Canada."],
      ['Contact', "Pour toute question relative aux présentes conditions d'utilisation, vous pouvez communiquer avec Silvousplait inc. à l'adresse suivante: spectacles@silvousplaitsvp.com"]
    ];
    return { sections: data.map(([title, body], i) => ({ num: i + 1, title, body })) };
  }
}
</script>
</body>
</html>
