[build]
  publish = "."
  command = "echo 'No build step needed for static site'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Resource-Policy = "same-site"
    Content-Security-Policy = "default-src 'self' https://*.clarity.ms https://c.bing.com; img-src 'self' data: https:; media-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline' https://fonts.bunny.net https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.clarity.ms https://*.clarity.ms https://connect.facebook.net https://www.googletagmanager.com; connect-src 'self' https://api.emailjs.com https://*.clarity.ms https://c.bing.com https://www.facebook.com https://connect.facebook.net https://www.googletagmanager.com; frame-src 'self' https://www.googletagmanager.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.bunny.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Referral links from the signup funnel's invite step (silvousplaitsvp.com/i/<nom>).
# Without this they fell through to the catch-all below, which serves the index
# stub — whose meta-refresh to "accueil.html" is RELATIVE, so from /i/alex it
# resolved to /i/accueil.html and the pasted link went nowhere. Must stay ABOVE
# the catch-all: Netlify applies the first matching rule.
# The name is carried through as ?ref= so the referral is still visible.
[[redirects]]
  from = "/i/*"
  to = "/accueil.html?ref=:splat"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
